<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1D4ED8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FairLeads">
<title>FairLeads</title>
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1D4ED8;
  --primary-light: #3B82F6;
  --primary-dark: #1E3A8A;
  --bg: #F1F5F9;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --nav-h: 64px;
  --hdr-h: 56px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.hdr {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--hdr-h);
  background: var(--primary); color: #fff;
  display: flex; align-items: center;
  padding: 0 8px 0 4px; z-index: 100; gap: 4px;
  box-shadow: 0 1px 6px rgba(0,0,0,.25);
}
.hdr-title { font-size: 17px; font-weight: 700; flex: 1; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-btn {
  background: none; border: none; color: #fff;
  width: 42px; height: 42px; border-radius: 10px;
  cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
.hdr-btn:active { background: rgba(255,255,255,.2); }

/* ── MAIN ── */
.main {
  margin-top: var(--hdr-h);
  padding-bottom: calc(var(--nav-h) + 8px);
  min-height: calc(100dvh - var(--hdr-h));
}
.view-pad { padding: 14px; }

/* ── BOTTOM NAV ── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h); background: #fff;
  border-top: 1px solid var(--border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nitem {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; background: none; border: none;
  cursor: pointer; color: var(--text-muted); padding: 6px 0;
}
.nitem.active { color: var(--primary); }
.nitem svg { width: 22px; height: 22px; }
.nitem span { font-size: 10px; font-weight: 500; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── STATS ── */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: #fff; border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 6px; text-align: center;
}
.stat-n { font-size: 22px; font-weight: 800; color: var(--primary); }
.stat-l { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

/* ── SEARCH ── */
.sbar { position: relative; margin-bottom: 10px; }
.sbar input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 15px; background: #fff; outline: none; color: var(--text);
}
.sbar input:focus { border-color: var(--primary-light); }
.sbar-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }

/* ── FILTER CHIPS ── */
.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  border: 1.5px solid var(--border); background: #fff; cursor: pointer;
  white-space: nowrap; color: var(--text-muted); flex-shrink: 0;
}
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ── LEAD CARD ── */
.lcard {
  background: #fff; border-radius: 14px; border: 1px solid var(--border);
  padding: 13px 14px; margin-bottom: 9px; cursor: pointer;
  transition: box-shadow .15s;
}
.lcard:active { box-shadow: 0 3px 12px rgba(0,0,0,.12); }
.lc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.lc-name { font-size: 16px; font-weight: 700; }
.lc-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.lc-int { font-size: 12px; color: var(--primary); margin-top: 3px; }
.badge {
  padding: 3px 9px; border-radius: 20px; font-size: 10px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .3px; flex-shrink: 0; margin-top: 2px;
}
.b-pendente   { background: #FEF3C7; color: #92400E; }
.b-contactado { background: #DBEAFE; color: #1E40AF; }
.b-qualificado{ background: #D1FAE5; color: #065F46; }
.b-descartado { background: #F1F5F9; color: #64748B; }
.lc-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
.lc-m { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 3px; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .ei { font-size: 52px; margin-bottom: 12px; }
.empty h3 { font-size: 18px; color: var(--text); margin-bottom: 7px; }
.empty p { font-size: 14px; line-height: 1.55; }

/* ── SCAN VIEW ── */
.scan-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
.cam-box {
  width: 100%; max-width: 380px; aspect-ratio: 1;
  background: #000; border-radius: 18px; overflow: hidden;
  position: relative; display: none;
}
#qr-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam-ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.cam-fr {
  width: 190px; height: 190px; border: 2.5px solid #fff;
  border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
  position: relative;
}
.cam-line {
  position: absolute; left: -2px; right: -2px; height: 2px;
  background: #60A5FA; border-radius: 2px;
  animation: scan 2s linear infinite;
}
@keyframes scan { 0%{top:0} 100%{top:calc(100% - 2px)} }
#scan-ok {
  width: 100%; max-width: 380px; background: #D1FAE5;
  border: 1px solid #6EE7B7; border-radius: 12px;
  padding: 11px 16px; font-size: 14px; color: #065F46; display: none;
}
.scan-hint { text-align: center; color: var(--text-muted); font-size: 14px; max-width: 300px; line-height: 1.5; }
canvas#qr-cv { display: none; }

/* ── FORM ── */
.fsec { margin-bottom: 20px; }
.fsec-t {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px; margin-bottom: 9px;
}
.fg { margin-bottom: 11px; }
.fl { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
.fi {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 15px; color: var(--text); outline: none;
  background: #fff; transition: border-color .2s; -webkit-appearance: none;
}
.fi:focus { border-color: var(--primary-light); }
textarea.fi { resize: vertical; min-height: 80px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── BUTTONS ── */
.btn {
  width: 100%; padding: 14px; border-radius: 12px; font-size: 15px;
  font-weight: 700; cursor: pointer; border: none;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-p { background: var(--primary); color: #fff; }
.btn-p:active { background: var(--primary-dark); }
.btn-o { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
.btn-d { background: #fff; color: var(--danger); border: 1.5px solid var(--danger); }
.btn-sm { width: auto; padding: 10px 20px; font-size: 14px; }
.btns-row { display: flex; gap: 10px; }
.btns-row .btn { flex: 1; }

/* ── DETAIL ── */
.d-hero {
  display: flex; align-items: center; gap: 12px;
  background: #fff; padding: 16px; border-radius: 14px;
  border: 1px solid var(--border); margin-bottom: 12px;
}
.d-av {
  width: 50px; height: 50px; background: var(--primary);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; font-weight: 800; flex-shrink: 0;
}
.d-av-name { font-size: 18px; font-weight: 800; }
.d-av-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.dcard { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px; margin-bottom: 12px; }
.drow { display: flex; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.drow:last-child { border-bottom: none; }
.dic { font-size: 16px; flex-shrink: 0; width: 24px; }
.dlbl { font-size: 11px; color: var(--text-muted); margin-bottom: 1px; }
.dval { font-size: 14px; color: var(--text); }
a.dval { color: var(--primary); text-decoration: none; }

/* ── MODAL ── */
.modal-ov {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 200; display: none; align-items: flex-end;
}
.modal-ov.open { display: flex; }
.modal {
  background: #fff; border-radius: 22px 22px 0 0;
  padding: 24px 20px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.modal-t { font-size: 18px; font-weight: 800; margin-bottom: 18px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 18px); left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: #1E293B; color: #fff;
  padding: 10px 22px; border-radius: 28px;
  font-size: 14px; font-weight: 600;
  opacity: 0; transition: all .25s; z-index: 400; white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── FAB ── */
.fab {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + 18px);
  width: 54px; height: 54px; background: var(--primary);
  border-radius: 50%; color: #fff; font-size: 28px;
  border: none; cursor: pointer; z-index: 90;
  box-shadow: 0 4px 14px rgba(29,78,216,.45);
  display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(.93); }
</style>
</head>

<!-- HEADER -->
<div class="hdr" id="hdr">
  <button class="hdr-btn" id="hdr-back" style="display:none" onclick="goBack()">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">

<!-- MAIN -->
<div class="main">

  <div class="view active view-pad" id="v-home">

          </div>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-t">🏢 Empresa</div>

          <label class="fl">Empresa</label>
          <input class="fi" type="text" id="f-emp" placeholder="Nome da empresa">
        </div>
        <div class="fg">
          <label class="fl">Cargo</label>

      </div>
      <div class="fsec">
        <div class="fsec-t">🎯 Interesse</div>

            <label class="fl">Data follow-up</label>

  <!-- ④ DETAIL -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
/* ════════════════════════════════════
   DATA
════════════════════════════════════ */
const KEY = 'fl_v1';
let D = { fair:'Feira', leads:[] };
let curView = 'home';
let editId  = null;
let filterVal = 'all';
let scanning  = false;
let stream    = null;
let raf       = null;

function load() {
  try { const s = localStorage.getItem(KEY); if (s) D = JSON.parse(s); } catch(e){}
}
function save() { localStorage.setItem(KEY, JSON.stringify(D)); }
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ════════════════════════════════════
   ROUTING
════════════════════════════════════ */
function showView(v) {
  if (curView === 'scan' && v !== 'scan') stopScan();

  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nitem').forEach(el => el.classList.remove('active'));

  document.getElementById('v-' + v).classList.add('active');
  const ni = document.getElementById('n-' + v);
  if (ni) ni.classList.add('active');

  const back = document.getElementById('hdr-back');
  const set  = document.getElementById('hdr-set');
  const ttl  = document.getElementById('hdr-title');

  if (v === 'form') {
    back.style.display = 'flex'; set.style.display = 'none';
    ttl.textContent = editId ? 'Editar Lead' : 'Novo Lead';
  } else if (v === 'detail') {
    back.style.display = 'flex'; set.style.display = 'none';
    ttl.textContent = 'Detalhes do Lead';
  } else {
    back.style.display = 'none'; set.style.display = 'flex';
    ttl.textContent = v === 'scan' ? 'Scan QR Code' : D.fair;
  }
  curView = v;
  if (v === 'home') renderLeads();
}

    return fok && sok;
  }).sort((a,b) => new Date(b.ts) - new Date(a.ts));

  const el = document.getElementById('leads-list');

    el.innerHTML = `<div class="empty">

    return;
  }
  el.innerHTML = list.map(l => `
    <div class="lcard" onclick="showDetail('${l.id}')">

          <div class="lc-name">${h(l.nome)}</div>
          ${(l.cargo||l.empresa)?`<div class="lc-sub">${h([l.cargo,l.empresa].filter(Boolean).join(' · '))}</div>`:''}
          ${l.interesse?`<div class="lc-int">🎯 ${h(l.interesse)}</div>`:''}

        ${l.email?`<span class="lc-m">✉️ ${h(l.email)}</span>`:''}
        ${l.tel?`<span class="lc-m">📞 ${h(l.tel)}</span>`:''}

function renderStats() {

function setFilter(f, el) {

/* ════════════════════════════════════
   QR SCANNER
════════════════════════════════════ */
async function startScan() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    const vid = document.getElementById('qr-video');
    vid.srcObject = stream;
    await vid.play();
    document.getElementById('cam-box').style.display = 'block';
    document.getElementById('btn-scan-start').style.display = 'none';
    document.getElementById('btn-scan-stop').style.display = 'flex';
    document.getElementById('scan-ok').style.display = 'none';
    scanning = true;
    raf = requestAnimationFrame(tick);
  } catch(e) {
    toast('Erro câmara: ' + (e.message||e));
  }
}

function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  document.getElementById('cam-box').style.display = 'none';
  document.getElementById('btn-scan-start').style.display = 'flex';
  document.getElementById('btn-scan-stop').style.display = 'none';
}

function tick() {
  if (!scanning) return;
  const vid = document.getElementById('qr-video');
  const cv  = document.getElementById('qr-cv');
  if (vid.readyState === vid.HAVE_ENOUGH_DATA) {
    cv.width  = vid.videoWidth;
    cv.height = vid.videoHeight;
    const ctx = cv.getContext('2d');
    ctx.drawImage(vid, 0, 0);
    const img = ctx.getImageData(0, 0, cv.width, cv.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'dontInvert' });
    if (code) { stopScan(); onQR(code.data); return; }
  }
  raf = requestAnimationFrame(tick);
}

function onQR(raw) {
  const ok = document.getElementById('scan-ok');
  ok.textContent = '✅ QR Code lido! A abrir formulário…';
  ok.style.display = 'block';
  toast('QR Code detetado!');
  setTimeout(() => { prepareNew(parseQR(raw)); showView('form'); }, 700);
}

function parseQR(s) {
  const c = {};
  // vCard
  if (s.includes('BEGIN:VCARD')) {
    for (const ln of s.split(/\r?\n/)) {
      if (/^FN:/i.test(ln))                        c.nome   = ln.slice(3).trim();
      else if (/^N:/i.test(ln) && !c.nome)         c.nome   = ln.slice(2).split(';').slice(0,2).reverse().join(' ').trim();
      else if (/^EMAIL[;:]/i.test(ln))             c.email  = ln.split(':').slice(1).join(':').trim();
      else if (/^TEL[;:]/i.test(ln))               c.tel    = ln.split(':').slice(1).join(':').trim();
      else if (/^ORG:/i.test(ln))                  c.emp    = ln.slice(4).split(';')[0].trim();
      else if (/^TITLE:/i.test(ln))                c.cargo  = ln.slice(6).trim();
    }
    return c;
  }
  // meCard
  if (s.startsWith('MECARD:')) {
    for (const f of s.slice(7).split(';')) {
      const i = f.indexOf(':'); if (i<0) continue;
      const k=f.slice(0,i), v=f.slice(i+1);
      if (k==='N')     c.nome  = v.replace(',', ' ').trim();
      if (k==='EMAIL') c.email = v;
      if (k==='TEL')   c.tel   = v;
      if (k==='ORG')   c.emp   = v;
    }
    return c;
  }
  // JSON
  try {
    const j = JSON.parse(s);
    return {
      nome: j.name||j.nome||j.fullName||'',
      email: j.email||'',
      tel: j.phone||j.tel||j.telefone||'',
      emp: j.company||j.empresa||j.org||'',
      cargo: j.title||j.cargo||j.role||'',
      notas: ''
    };
  } catch(e){}
  // fallback
  return { notas: 'Dados do QR:\n' + s };
}

/* ════════════════════════════════════
   FORM
════════════════════════════════════ */
function prepareNew(pre) {
  editId = null;
  document.getElementById('lead-form').reset();
  const d7 = new Date(); d7.setDate(d7.getDate()+7);
  document.getElementById('f-date').value = d7.toISOString().split('T')[0];
  if (pre) {
    if (pre.nome)  document.getElementById('f-nome').value  = pre.nome;
    if (pre.email) document.getElementById('f-email').value = pre.email;
    if (pre.tel)   document.getElementById('f-tel').value   = pre.tel;
    if (pre.emp)   document.getElementById('f-emp').value   = pre.emp;
    if (pre.cargo) document.getElementById('f-cargo').value = pre.cargo;
    if (pre.notas) document.getElementById('f-notas').value = pre.notas;
  }
}

function loadEdit(id) {
  const l = D.leads.find(x=>x.id===id); if (!l) return;
  editId = id;
  document.getElementById('f-nome').value  = l.nome   ||'';
  document.getElementById('f-email').value = l.email  ||'';
  document.getElementById('f-tel').value   = l.tel    ||'';
  document.getElementById('f-emp').value   = l.empresa||'';
  document.getElementById('f-cargo').value = l.cargo  ||'';
  document.getElementById('f-int').value   = l.interesse||'';
  document.getElementById('f-notas').value = l.notas  ||'';
  document.getElementById('f-est').value   = l.estado ||'pendente';
  document.getElementById('f-date').value  = l.date   ||'';
  showView('form');
}

function saveLead(e) {
  e.preventDefault();
  const lead = {
    id:       editId || uid(),
    ts:       editId ? (D.leads.find(x=>x.id===editId)?.ts||new Date().toISOString()) : new Date().toISOString(),
    upd:      new Date().toISOString(),
    nome:     document.getElementById('f-nome').value.trim(),
    email:    document.getElementById('f-email').value.trim(),
    tel:      document.getElementById('f-tel').value.trim(),
    empresa:  document.getElementById('f-emp').value.trim(),
    cargo:    document.getElementById('f-cargo').value.trim(),
    interesse:document.getElementById('f-int').value.trim(),
    notas:    document.getElementById('f-notas').value.trim(),
    estado:   document.getElementById('f-est').value,
    date:     document.getElementById('f-date').value,
  };
  if (editId) {
    const i = D.leads.findIndex(x=>x.id===editId);
    if (i>=0) D.leads[i] = lead;
  } else {
    D.leads.push(lead);
  }
  save();
  toast(editId ? 'Lead atualizado!' : '✅ Lead adicionado!');
  editId = null;
  showView('home');
}

function delLead(id) {
  if (!confirm('Apagar este lead?')) return;
  D.leads = D.leads.filter(x=>x.id!==id);
  save(); toast('Lead apagado!'); showView('home');
}

/* ════════════════════════════════════
   EXPORT
════════════════════════════════════ */
function exportCSV() {
  if (!D.leads.length) { toast('Sem leads para exportar!'); return; }
  const hdr = ['Nome','Email','Telefone','Empresa','Cargo','Interesse','Notas','Estado','Data Follow-up','Data Registo'];
  const rows = D.leads.map(l=>[
    l.nome,l.email,l.tel,l.empresa,l.cargo,l.interesse,
    (l.notas||'').replace(/\n/g,' '),
    slbl(l.estado),l.date||'',
    l.ts?new Date(l.ts).toLocaleDateString('pt-PT'):''
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`));
  const csv = [hdr.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `leads_${D.fair.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast(`${D.leads.length} leads exportados ✅`);
}

function openSettings() {
  document.getElementById('si-fair').value = D.fair;
  document.getElementById('modal-set').classList.add('open');
}
function closeModal(e, id) {
  if (e.target === document.getElementById(id))
    document.getElementById(id).classList.remove('open');
}
function saveFair() {
  const v = document.getElementById('si-fair').value.trim();
  if (v) { D.fair = v; save(); document.getElementById('hdr-title').textContent = v; toast('Nome da feira atualizado!'); }
  document.getElementById('modal-set').classList.remove('open');
}
function clearAll() {
  if (!confirm(`Apagar todos os ${D.leads.length} leads?`)) return;
  D.leads = []; save();
  document.getElementById('modal-set').classList.remove('open');
  toast('Todos os leads apagados!');
  renderLeads();
}

/* ════════════════════════════════════
   UTILS
════════════════════════════════════ */
function h(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slbl(e) {
  return {pendente:'⏳ Pendente',contactado:'📞 Contactado',qualificado:'✅ Qualificado',descartado:'❌ Descartado'}[e]||e;
}
function fdate(s) {
  try { return new Date(s+'T00:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){return s;}
}
function fdt(s) {
  try { return new Date(s).toLocaleString('pt-PT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){return s;}
}
let tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2600);
}

load();
document.getElementById('hdr-title').textContent = D.fair;
renderLeads();
